<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>گیم‌هاب</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ff;--card:#fff;--ink:#1d1a45;--mute:#6b6896;--line:#e3dfff;--acc:#5b3df5;--acc2:#ffb703;--ok:#12a36b;--bad:#d6345a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15122e;--card:#201c45;--ink:#f1efff;--mute:#a9a5d6;--line:#33306a;--acc:#8b74ff;--acc2:#ffc933;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header{padding:44px 0 26px}
.top{display:flex;justify-content:flex-end}
.btn{font:inherit;border:0;border-radius:12px;padding:9px 18px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.bad{background:var(--bad)}
h1{font-size:clamp(34px,7vw,60px);font-weight:800;margin:8px 0 0;letter-spacing:-1px}
.tag{color:var(--mute);font-size:18px;margin:4px 0 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
.tools input{flex:1;min-width:200px}.tools select{width:auto}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:60px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px 20px 18px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c,var(--acc))}
.badge{align-self:flex-start;font-size:13px;font-weight:600;padding:1px 12px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--acc)) 16%,transparent);color:var(--ink);margin-top:4px}
.card h3{margin:2px 0;font-size:20px}
.card p{margin:0;color:var(--mute);font-size:15px;flex:1;white-space:pre-line}
.meta{font-size:13px;color:var(--mute)}
.card .btn{margin-top:8px;width:100%}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0;border:2px dashed var(--line);border-radius:18px}
/* admin */
.ov{position:fixed;inset:0;background:rgba(10,8,30,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 30px;z-index:10}
.ov.open{display:flex}
.box{background:var(--bg);border-radius:20px;padding:24px;width:100%;max-width:640px;border:1.5px solid var(--line)}
.box h2{margin:0 0 14px;font-size:22px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
.drop{display:block;text-align:center;border:2px dashed var(--acc);border-radius:14px;padding:22px 10px;cursor:pointer;color:var(--mute);font-weight:400}
.drop.on{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;margin-top:8px}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
hr{border:0;border-top:1.5px solid var(--line);margin:22px 0 4px}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><button class="btn ghost" id="openAdmin">پنل مدیریت</button></div>
    <h1 id="siteTitle">گیم‌هاب</h1>
    <p class="tag" id="siteTag"></p>
    <div class="tools">
      <input id="q" placeholder="جستجوی بازی…" aria-label="جستجو">
      <select id="f" aria-label="فیلتر نوع"></select>
    </div>
  </header>
  <main id="list"></main>
</div>

<!-- login -->
<div class="ov" id="login"><div class="box" style="max-width:380px">
  <h2>ورود مدیر</h2>
  <label for="pw">رمز عبور</label>
  <input id="pw" type="password" autocomplete="off">
  <div class="row"><button class="btn" id="doLogin">ورود</button><button class="btn ghost" data-close>بستن</button></div>
</div></div>

<!-- admin -->
<div class="ov" id="admin"><div class="box">
  <h2>افزودن بازی جدید</h2>
  <label for="aTitle">نام بازی</label><input id="aTitle">
  <label for="aDesc">توضیحات</label><textarea id="aDesc" rows="3"></textarea>
  <label for="aType">نوع فایل</label><select id="aType"></select>
  <label>فایل</label>
  <label class="drop" id="drop" for="aFile"><span id="dropTxt">فایل را اینجا بکش یا کلیک کن</span></label>
  <input id="aFile" type="file" hidden>
  <label for="aLink">یا لینک مستقیم دانلود (برای فایل‌های حجیم)</label>
  <input id="aLink" placeholder="https://…" dir="ltr">
  <div class="row"><button class="btn" id="save">افزودن</button><button class="btn ghost" data-close>بستن</button></div>

  <hr>
  <h2 style="margin-top:18px">بازی‌های ثبت‌شده</h2>
  <div id="manage"></div>

  <hr>
  <h2 style="margin-top:18px">تنظیمات سایت</h2>
  <label for="sTitle">عنوان سایت</label><input id="sTitle">
  <label for="sTag">شعار</label><input id="sTag">
  <div class="row"><button class="btn ghost" id="saveSet">ذخیره تنظیمات</button></div>

  <hr>
  <h2 style="margin-top:18px">انتشار سایت</h2>
  <p class="note">بازی‌ها فقط در همین مرورگر ذخیره می‌شن. برای اینکه بقیه ببینن، «ساخت فایل نهایی» رو بزن و فایل جدید رو روی هاست (مثلاً گیت‌هاب پیجز یا هر هاست دیگه) آپلود کن. فایل‌های حجیم رو بهتر با لینک اضافه کن.</p>
  <div class="row"><button class="btn" id="export">ساخت فایل نهایی</button><button class="btn ghost" id="logout">خروج</button></div>
</div></div>
<div id="toast" role="status"></div>

<script id="seed" type="application/json">{"settings":{"title":"گیم‌هاب","tagline":"بازی‌های من؛ رایگان دانلود کن"},"items":[]}</script>
<script>
const PASS='code of god';
const TYPES={apk:['اندروید (APK)','#12a36b'],pc:['ویندوز (EXE)','#5b3df5'],html:['بازی وب (HTML)','#e8590c'],zip:['فایل فشرده','#d6345a'],other:['سایر','#0b86d6']};
const $=s=>document.querySelector(s);
const seed=JSON.parse($('#seed').textContent);
let settings=seed.settings,local=[],file=null;
const hidden=()=>{try{return JSON.parse(localStorage.getItem('gh_hidden')||'[]')}catch(e){return[]}};
const setHidden=a=>{try{localStorage.setItem('gh_hidden',JSON.stringify(a))}catch(e){}};
try{const s=JSON.parse(localStorage.getItem('gh_settings')||'null');if(s)settings=s}catch(e){}

/* IndexedDB */
let db;
const open=()=>new Promise(r=>{try{const q=indexedDB.open('gamehub',1);q.onupgradeneeded=()=>q.result.createObjectStore('items',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const tx=(m,f)=>new Promise(r=>{if(!db)return r([]);const t=db.transaction('items',m),s=t.objectStore('items'),q=f(s);t.oncomplete=()=>r(q&&q.result);t.onerror=()=>r([])});
const loadLocal=async()=>{local=(await tx('readonly',s=>s.getAll()))||[]};
const visible=()=>[...seed.items.filter(i=>!hidden().includes(i.id)),...local].sort((a,b)=>b.date-a.date);

const fmt=n=>n<1048576?(n/1024).toFixed(0)+' کیلوبایت':(n/1048576).toFixed(1)+' مگابایت';
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const guess=n=>{n=n.toLowerCase();return n.endsWith('.apk')?'apk':n.endsWith('.exe')||n.endsWith('.msi')?'pc':n.endsWith('.html')||n.endsWith('.htm')?'html':/\.(zip|rar|7z)$/.test(n)?'zip':'other'};

function fillTypes(){
  $('#aType').innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
  $('#f').innerHTML='<option value="">همه نوع‌ها</option>'+Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
}
function head(){
  $('#siteTitle').textContent=settings.title;$('#siteTag').textContent=settings.tagline;document.title=settings.title;
  $('#sTitle').value=settings.title;$('#sTag').value=settings.tagline;
}
function render(){
  const q=$('#q').value.trim().toLowerCase(),f=$('#f').value;
  const list=visible().filter(i=>(!f||i.type===f)&&(!q||(i.title+i.desc).toLowerCase().includes(q)));
  $('#list').innerHTML=list.length?list.map(i=>{
    const t=TYPES[i.type]||TYPES.other;
    return `<article class="card" style="--c:${t[1]}"><span class="badge">${t[0]}</span><h3>${esc(i.title)}</h3><p>${esc(i.desc||'')}</p><div class="meta">${i.size?fmt(i.size)+' • ':''}${new Date(i.date).toLocaleDateString('fa-IR')}</div><button class="btn" data-dl="${i.id}">دانلود</button></article>`}).join('')
    :'<div class="empty">هنوز بازی‌ای اضافه نشده.</div>';
  $('#manage').innerHTML=visible().map(i=>`<div class="item"><span>${esc(i.title)}</span><button class="btn bad" data-del="${i.id}">حذف</button></div>`).join('')||'<p class="note">چیزی ثبت نشده.</p>';
}
async function download(id){
  const i=visible().find(x=>x.id===id);if(!i)return;
  if(i.url){window.open(i.url,'_blank','noopener');return}
  let blob=i.blob;
  if(!blob&&i.data)blob=await (await fetch(i.data)).blob();
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=i.name||i.title;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const toData=b=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(b)});

/* events */
$('#q').oninput=render;$('#f').onchange=render;
$('#list').onclick=e=>{const b=e.target.closest('[data-dl]');if(b)download(b.dataset.dl)};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.ov').classList.remove('open'));
$('#openAdmin').onclick=()=>{if(sessionStorage.getItem('gh_admin')){$('#admin').classList.add('open')}else{$('#login').classList.add('open');$('#pw').value='';$('#pw').focus()}};
const login=()=>{if($('#pw').value.trim().toLowerCase()===PASS){sessionStorage.setItem('gh_admin','1');$('#login').classList.remove('open');$('#admin').classList.add('open')}else toast('رمز اشتباهه')};
$('#doLogin').onclick=login;$('#pw').onkeydown=e=>{if(e.key==='Enter')login()};
$('#logout').onclick=()=>{sessionStorage.removeItem('gh_admin');$('#admin').classList.remove('open')};

const pick=f=>{file=f;$('#dropTxt').textContent=f.name+' — '+fmt(f.size);$('#aType').value=guess(f.name);if(!$('#aTitle').value)$('#aTitle').value=f.name.replace(/\.[^.]+$/,'')};
$('#aFile').onchange=e=>e.target.files[0]&&pick(e.target.files[0]);
const d=$('#drop');
['dragenter','dragover'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.add('on')}));
['dragleave','drop'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.remove('on')}));
d.addEventListener('drop',e=>e.dataTransfer.files[0]&&pick(e.dataTransfer.files[0]));

$('#save').onclick=async()=>{
  const title=$('#aTitle').value.trim(),url=$('#aLink').value.trim();
  if(!title)return toast('نام بازی رو بنویس');
  if(!file&&!url)return toast('یه فایل انتخاب کن یا لینک بذار');
  const it={id:'g'+Date.now(),title,desc:$('#aDesc').value.trim(),type:$('#aType').value,date:Date.now()};
  if(file){it.blob=file;it.name=file.name;it.size=file.size}else it.url=url;
  await tx('readwrite',s=>s.put(it));
  await loadLocal();
  ['#aTitle','#aDesc','#aLink'].forEach(s=>$(s).value='');file=null;$('#aFile').value='';$('#dropTxt').textContent='فایل را اینجا بکش یا کلیک کن';
  render();toast('بازی اضافه شد');
};
$('#manage').onclick=async e=>{
  const b=e.target.closest('[data-del]');if(!b||!confirm('حذف بشه؟'))return;
  const id=b.dataset.del;
  if(local.some(i=>i.id===id)){await tx('readwrite',s=>s.delete(id));await loadLocal()}else setHidden([...hidden(),id]);
  render();toast('حذف شد');
};
$('#saveSet').onclick=()=>{
  settings={title:$('#sTitle').value.trim()||'گیم‌هاب',tagline:$('#sTag').value.trim()};
  try{localStorage.setItem('gh_settings',JSON.stringify(settings))}catch(e){}
  head();toast('ذخیره شد');
};
$('#export').onclick=async()=>{
  toast('در حال ساخت فایل…');
  const items=[];
  for(const i of visible()){const o={...i};if(o.blob){o.data=await toData(o.blob);delete o.blob}items.push(o)}
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#seed').textContent=JSON.stringify({settings,items}).replace(/</g,'\\u003c');
  c.querySelector('#list').innerHTML='';c.querySelector('#manage').innerHTML='';
  c.querySelectorAll('.ov').forEach(o=>o.classList.remove('open'));
  const blob=new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download='index.html';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.ov.open').forEach(o=>o.classList.remove('open'))});

(async()=>{fillTypes();await open();await loadLocal();head();render()})();
</script>
</body>
</html>
